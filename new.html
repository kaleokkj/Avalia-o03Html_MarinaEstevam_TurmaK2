
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fio de Lua | Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="index.html" class="logo">☾ Fio de Lua</a>
    <nav>
        <a href="index.html">Início</a>
        <a href="produto.html">Produtos</a>
        <a href="login.html">Entrar</a>
        <a href="new.html">Cadastrar</a>
    </nav>
</header>

<main class="form-page">
    <section class="form-box">
        <span class="tag">FAÇA PARTE DA NOSSA HISTÓRIA</span>
        <h1>Crie sua conta!</h1>
        <p>Preencha seus dados para se cadastrar.</p>

        <form action="#" method="get">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="Seu melhor e-mail" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone"
                   placeholder="(00) 00000-0000">

            <label for="senha">Crie uma senha</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Mínimo de 6 caracteres"
                   minlength="6" required>

            <button type="submit" class="btn form-btn">Criar conta</button>
        </form>

        <p class="form-footer">
            Já possui uma conta?
            <a href="login.html">Faça login</a>
        </p>
    </section>
</main>

<footer>
    <p>☾ Fio de Lua — A beleza de ser você.</p>
    <p>© 2026 Fio de Lua.</p>
</footer>

</body>
</html>
