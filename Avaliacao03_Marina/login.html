<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fio de Lua | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="index.html" class="logo">☾ Fio de Lua</a>
    <nav>
        <a href="index.html">Início</a>
        <a href="produto.html">Produtos</a>
        <a href="login.html">Entrar</a>
        <a href="new.html">Cadastrar</a>
    </nav>
</header>

<main class="form-page">
    <section class="form-box">
        <span class="tag">BEM-VINDO DE VOLTA</span>
        <h1>Que bom ter você aqui!</h1>
        <p>Entre na sua conta para continuar.</p>

        <form action="#" method="get">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Digite sua senha" required>

            <button type="submit" class="btn form-btn">Entrar</button>
        </form>

        <p class="form-footer">
            Ainda não tem uma conta?
            <a href="new.html">Cadastre-se</a>
        </p>
    </section>
</main>

<footer>
    <p>☾ Fio de Lua — A beleza de ser você.</p>
    <p>© 2026 Fio de Lua.</p>
</footer>

</body>
</html>
